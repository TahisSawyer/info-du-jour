# Vérifie chaque flux RSS du catalogue et affiche un rapport (onglet Actions > Vérifier les flux).
# Lancé chaque lundi matin, ou à la main après une modification de config/sources.yaml.
name: Vérifier les flux

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    name: Vérification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q httpx feedparser pyyaml
      - name: Rapport
        run: python -m infodujour verifier-flux
