# Compléments par API (facultatifs : utilisés seulement si la clé correspondante est fournie
# dans les secrets GitHub). Les articles dont le site figure dans le catalogue ci-dessus
# reprennent l'orientation du catalogue ; les autres sont classés « autre ».
api:
  gnews: {actif: true, cle_env: GNEWS_API_KEY, requetes: [{lang: fr, country: fr}, {lang: en}]}
  newsdata: {actif: true, cle_env: NEWSDATA_API_KEY, requetes: [{language: fr, country: fr}, {language: en}]}
  guardian: {actif: true, cle_env: GUARDIAN_API_KEY}
