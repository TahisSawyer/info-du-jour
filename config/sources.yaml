# Catalogue des sources d'Info du Jour
# ------------------------------------------------------------------
# orientation : gauche | centre-gauche | centre | centre-droit | droite
#               | non-partisan (services publics, agences) | autre (regard non occidental, inclassable)
# Les orientations sont INDICATIVES : elles résument une ligne éditoriale générale,
# pas chaque article. Modifiez-les librement (toute modification est datée dans l'historique Git).
# nature : generaliste | economique | service-public | independant | regional | magazine | radio-tv
# payant : true si la plupart des articles sont réservés aux abonnés
# region : france | europe | amerique-nord | amerique-latine | afrique | asie | moyen-orient | monde
# actif : false pour désactiver une source sans la supprimer
# Les adresses de flux sont vérifiées par le workflow « Vérifier les flux » (onglet Actions).

