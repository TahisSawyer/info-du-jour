# Réglages généraux d'Info du Jour
# Toutes les heures sont en heure de Paris (le changement d'heure est géré automatiquement).

fuseau: Europe/Paris

planning:
  collecte_debut: "06:00"        # pas de collecte la nuit
  collecte_fin: "22:00"
  preparation: ["11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00"] # résumés IA préparés au fil de la journée, hors pic de saturation
  duree_preparation_min: 60      # créneaux d'une heure : GitHub déclenche ~1 fois/heure à minute variable
  edition: "18:00"               # lancement de l'édition (prête en général entre 18 h 15 et 19 h)
  rattrapage_fin: "22:00"        # relance de l'IA sur les sujets « Sans IA » jusqu'à cette heure
  rattrapage_auto: true
  delai_min_rafraichissement_min: 30   # délai minimal entre deux rafraîchissements manuels
  budget_edition_min: 20         # au-delà, les sujets restants passent en mode sans IA

collecte:
  fenetre_heures: 30             # articles retenus pour une édition
  conservation_heures: 72        # articles gardés en mémoire entre deux exécutions
  delai_requete_s: 20
  requetes_simultanees: 10
  alerte_echecs_consecutifs: 3   # un flux en échec 3 fois de suite est signalé dans « Nos sources »

regroupement:
  moteur: auto                   # auto | fastembed | tfidf  (auto = fastembed s'il est installé)
  modele: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  distance_fastembed: 0.42       # distance cosinus maximale entre articles d'un même sujet
  distance_tfidf: 0.86
  seuil_depeche: 0.80            # similarité de chapô au-delà de laquelle on parle d'une reprise de dépêche
  poids_reprise: 0.25            # un média qui ne fait que reprendre une dépêche compte pour 0,25

classement:
  poids: {couverture: 0.45, diversite: 0.25, fraicheur: 0.20, reprise: 0.10}
  demi_vie_heures: 12
  taille_top: 10
  sujets_par_rubrique: 5
  rubriques_hors_tops: true      # un sujet déjà dans un Top 10 n'est pas répété dans sa rubrique
  medias_min_top: 2
  sources_affichees: 6
  angles_morts_max: 5
  angles_morts_medias_min: 4

ia:
  actif: true
  taille_lot: 5                  # sujets envoyés par appel
  temperature: 0.2
  # Fournisseurs essayés dans cet ordre (Gemini, puis les secours gratuits Groq et OpenRouter). Les modèles « tops » rédigent les Tops 10 et l'essentiel,
  # les modèles « rubriques » le reste. Si un modèle est refusé, le suivant de la liste est essayé.
  # Les noms de modèles évoluent : si aucun n'est disponible pour la clé, l'application choisit
  # automatiquement les modèles « flash » ou « small » les plus récents proposés par le fournisseur.
  fournisseurs:
    - nom: Gemini
      url: https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
      cle_env: GEMINI_API_KEY
      intervalle_s: 13
      modeles: {tops: [gemini-3.6-flash, gemini-3.5-flash-lite, gemini-3.5-flash], rubriques: [gemini-3.5-flash-lite, gemini-3.1-flash-lite, gemini-3.5-flash, gemini-3.6-flash]}
      parametres: {reasoning_effort: low}   # réflexion courte : réponses plus rapides (retiré si refusé)
    # Secours gratuit n° 1 : Groq (sans carte bancaire ; quotas par modèle et par jour)
    - nom: Groq
      url: https://api.groq.com/openai/v1/chat/completions
      cle_env: GROQ_API_KEY
      intervalle_s: 20
      modeles: {tops: [openai/gpt-oss-120b, llama-3.3-70b-versatile, qwen/qwen3-32b], rubriques: [openai/gpt-oss-120b, llama-3.3-70b-versatile, qwen/qwen3-32b]}
      parametres: {reasoning_effort: low}
    # Secours gratuit n° 2 : OpenRouter, modèles « :free » (choisis automatiquement s'ils changent)
    - nom: OpenRouter
      url: https://openrouter.ai/api/v1/chat/completions
      cle_env: OPENROUTER_API_KEY
      intervalle_s: 4
      gratuit_seulement: true
      modeles: {tops: [meta-llama/llama-3.3-70b-instruct:free, openai/gpt-oss-120b:free], rubriques: [meta-llama/llama-3.3-70b-instruct:free, openai/gpt-oss-120b:free]}
    # Facultatif et payant à l'usage : utilisé seulement si la clé MISTRAL_API_KEY est fournie
    - nom: Mistral
      url: https://api.mistral.ai/v1/chat/completions
      cle_env: MISTRAL_API_KEY
      intervalle_s: 2
      modeles: {tops: [mistral-medium-latest, mistral-small-latest], rubriques: [mistral-small-latest]}
  reutilisation_jaccard: 0.70    # un résumé est réutilisé si le sujet a peu changé
  reutilisation_nouveaux_max: 3
  repli_couverture_min: 0.50     # IA saturée : reprise du résumé préparé plus tôt si le sujet est le même
  repli_jaccard_min: 0.25

pluralisme:
  alerte_part_max: 0.35          # alerte si une sensibilité dépasse 35 % des liens affichés
  alerte_part_min: 0.10          # ou passe sous 10 %

audio:
  actif: false                   # mettre à true pour générer l'édition audio (synthèse vocale Piper)
  voix: fr_FR-siwis-medium

archives_jours: 365
